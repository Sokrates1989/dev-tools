deploy_key.title=🔑 Deploy Key Manager
deploy_key.title_divider===================
deploy_key.help.usage=Usage: dev-tools --deploy-key | --dk
deploy_key.help.description=Creates or reuses one repository-specific ED25519 deploy key for this hostname.
deploy_key.help.input=Input: a repository URL or complete git remote -v output.
deploy_key.help.storage=Storage: ~/.ssh/dev-tools/deploy-keys/. The helper never edits ~/.ssh/config.
deploy_key.help.instructions=After printing the public key, interactive use asks which setup stage to show. Set DEPLOY_KEY_INSTRUCTION_MODE to provider, ssh, or both for non-interactive use.
