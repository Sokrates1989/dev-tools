# English messages shared by the Dev Tools launcher and global workflows.
updates.available=Dev Tools update available: %s -> %s.
updates.prompt=Update Dev Tools now? [Y/n]
updates.invalid=Please enter yes or no.
updates.declined=Update skipped. Continuing with the requested command.
updates.performing=Updating Dev Tools from %s to %s...
updates.complete=Dev Tools updated successfully: %s -> %s.
updates.failed=Dev Tools update failed. Continuing with the installed version.
updates.current=Dev Tools is already up to date.
updates.dirty=Dev Tools has local changes. Commit or discard them before updating.
updates.ahead=Dev Tools contains local commits that are not upstream. Push or reconcile them before updating.
updates.diverged=Dev Tools and its upstream have diverged. Reconcile the branches manually before updating.
updates.detached=Dev Tools is on a detached HEAD. Check out its tracked branch before updating.
updates.unexpected_branch=Dev Tools is not on the main branch. Switch to main before updating.
updates.missing_upstream=Dev Tools has no configured upstream branch. Configure one before updating.
updates.unexpected_upstream=Dev Tools does not track origin/main. Restore the official upstream before updating.
updates.unexpected_origin=Dev Tools origin does not match the official repository. Update skipped for safety.
