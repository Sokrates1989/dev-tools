# Deutsche Meldungen für den Dev-Tools-Starter und globale Abläufe.
updates.available=Dev-Tools-Update verfügbar: %s -> %s.
updates.prompt=Dev Tools jetzt aktualisieren? [J/n]
updates.invalid=Bitte Ja oder Nein eingeben.
updates.declined=Update übersprungen. Der angeforderte Befehl wird fortgesetzt.
updates.performing=Dev Tools wird von %s auf %s aktualisiert...
updates.complete=Dev Tools wurde erfolgreich aktualisiert: %s -> %s.
updates.failed=Das Dev-Tools-Update ist fehlgeschlagen. Die installierte Version wird weiterverwendet.
updates.current=Dev Tools ist bereits aktuell.
updates.dirty=Dev Tools enthält lokale Änderungen. Bitte vor dem Update committen oder verwerfen.
updates.ahead=Dev Tools enthält lokale Commits, die noch nicht im Upstream liegen. Bitte vor dem Update pushen oder abgleichen.
updates.diverged=Dev Tools und der Upstream sind auseinander gelaufen. Bitte die Branches vor dem Update manuell abgleichen.
updates.detached=Dev Tools befindet sich auf einem losgelösten HEAD. Bitte vor dem Update den getrackten Branch auschecken.
updates.unexpected_branch=Dev Tools befindet sich nicht auf dem main-Branch. Bitte vor dem Update zu main wechseln.
updates.missing_upstream=Für Dev Tools ist kein Upstream-Branch konfiguriert. Bitte vor dem Update einen Upstream einrichten.
updates.unexpected_upstream=Dev Tools trackt nicht origin/main. Bitte vor dem Update den offiziellen Upstream wiederherstellen.
updates.unexpected_origin=Der Dev-Tools-Origin entspricht nicht dem offiziellen Repository. Das Update wurde aus Sicherheitsgründen übersprungen.
