deploy_key.github.heading=GitHub-Einrichtung
deploy_key.github.step_open=1. Öffnen:
deploy_key.github.step_add=2. Auf Add deploy key klicken.
deploy_key.github.step_title=3. Vorgeschlagener Titel:
deploy_key.github.step_paste=4. Den oben ausgegebenen ÖFFENTLICHEN SCHLÜSSEL einfügen.
deploy_key.github.step_read_only=5. "Allow write access" für normale Deployments DEAKTIVIERT lassen.
deploy_key.github.read_only_explanation=Nur-Lese-Zugriff wird für Server empfohlen, die nur klonen, abrufen oder pullen. Schreibzugriff nur aktivieren, wenn dieser Server wirklich pushen muss.
deploy_key.generic.heading=Provider-Einrichtung
deploy_key.generic.instructions=Den oben ausgegebenen ÖFFENTLICHEN SCHLÜSSEL in den Repository-Einstellungen als Nur-Lese-Deploy-Key hinzufügen. Schreibzugriff nur aktivieren, wenn dieser Server wirklich pushen muss.
deploy_key.instructions.heading=Nächster Einrichtungsschritt
deploy_key.instructions.explanation=Die Registrierung beim Repository-Provider und die SSH-/Git-Konfiguration dieses Servers sind beide erforderlich und keine alternativen Verbindungsmethoden. Jetzt die gewünschten Anweisungen auswählen; für die andere Phase kann der Helfer später erneut ausgeführt werden.
deploy_key.instructions.provider_github=GitHub
deploy_key.instructions.option_provider=1) Repository-Provider (%s): öffentlichen Schlüssel hinzufügen.
deploy_key.instructions.option_ssh=2) Dieser Server: Checkout für die Schlüsselnutzung über SSH konfigurieren.
deploy_key.instructions.option_both=3) Beide Phasen anzeigen.
deploy_key.instructions.prompt=Anweisungen auswählen [1]:
deploy_key.instructions.invalid=Bitte 1, 2 oder 3 auswählen.
deploy_key.instructions.invalid_mode=Nicht unterstützter Wert für DEPLOY_KEY_INSTRUCTION_MODE: %s. provider, ssh oder both verwenden.
deploy_key.ssh.heading=Git-/SSH-Einrichtung auf diesem Server
deploy_key.existing_clone.heading=Vorhandener Checkout (empfohlen):
