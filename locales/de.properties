deploy_key.error.unsafe_path=Ein verwalteter Schlüsselpfad ist ein symbolischer Link oder keine reguläre Datei. Schlüsselmaterial wurde nicht geändert.
deploy_key.error.mismatched_pair=Die verwalteten öffentlichen und privaten Dateien bilden kein passendes Schlüsselpaar. Schlüsselmaterial wurde nicht geändert.
