deploy_key.title=🔑 Deploy-Key-Manager
deploy_key.title_divider===================
deploy_key.help.usage=Verwendung: dev-tools --deploy-key | --dk
deploy_key.help.description=Erstellt oder verwendet einen Repository-spezifischen ED25519-Deploy-Key für diesen Hostnamen.
deploy_key.help.input=Eingabe: eine Repository-URL oder die vollständige Ausgabe von git remote -v.
deploy_key.help.storage=Speicherort: ~/.ssh/dev-tools/deploy-keys/. Der Helfer bearbeitet ~/.ssh/config nicht.
deploy_key.help.instructions=Nach Ausgabe des öffentlichen Schlüssels fragt die interaktive Nutzung, welche Einrichtungsphase angezeigt werden soll. Für nicht interaktive Nutzung DEPLOY_KEY_INSTRUCTION_MODE auf provider, ssh oder both setzen.
deploy_key.detected_server=Erkannter Server: %s
deploy_key.detected_repository=Erkanntes aktuelles Repository:
