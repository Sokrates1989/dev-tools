deploy_key.error.missing_command=Erforderlicher Befehl ist nicht verfügbar: %s.
deploy_key.error.home_missing=HOME ist nicht gesetzt; das verwaltete SSH-Verzeichnis kann daher nicht bestimmt werden.
deploy_key.error.hostname=Der aktuelle Server-Hostname konnte nicht ermittelt werden.
